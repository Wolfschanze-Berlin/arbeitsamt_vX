[package]
name = "arbeitsamt_vx"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "arbeitsamt_vx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Tauri plugins — all platforms
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
tauri-plugin-websocket = "2"
tauri-plugin-upload = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-localhost = "2"
tauri-plugin-sql = { version = "2", features = ["postgres", "sqlite"] }

# SSH client
russh = { version = "0.57", default-features = false, features = ["ring", "async-trait"] }
russh-sftp = "2"
russh-config = "0.57"
dashmap = "6"
tokio = { version = "1", features = ["sync", "net", "io-util", "rt", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
openssh-keys = "0.6"
dirs = "6"
portable-pty = "0.8"
dotenvy = "0.15.7"

# AWS SDK — cloud management
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1"
aws-sdk-sts = "1"
aws-types = "1"
aws-credential-types = "1"

# Stronghold — encrypted secret storage for cloud credentials
tauri-plugin-stronghold = "2"
argon2 = "0.5"

# Tauri plugins — desktop only
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"
tauri-plugin-positioner = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
